<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The macOS app icon: icon.svg on Apple's grid, an 824-point body with
       its own drop shadow inside a 1024-point canvas. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7C52"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.4" fill="url(#body)" filter="url(#shadow)"/>
    <path fill="#FFFFFF" d="M33 23 H67 Q70 23 70.4 26 L72.6 44 Q73 47 70 47 H30 Q27 47 27.4 44 L29.6 26 Q30 23 33 23 Z"/>
    <path fill="#FFFFFF" d="M30 53 H70 Q73 53 73 56 V74 Q73 77 70 77 H30 Q27 77 27 74 V56 Q27 53 30 53 Z"/>
  </g>
</svg>
