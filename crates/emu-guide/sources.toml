# Guide's source map: the sites players trust for each series, in order of
# trust. Chosen and checked in docs/research/game-chat.md §5; re-checked by
# hand with scripts/guide/check-sources.sh.
#
# - A game gets its series' sources, then the fallback ones, with no domain
#   twice and at most twelve in all (the fallback is trimmed first). A fan
#   game gets the fan-game sources before its series'.
# - A series matches when one of its `titles` appears, as whole words, in
#   the game's No-Intro name or its library title. Case, accents,
#   punctuation and the words "the" and "version" are ignored, so "Legend of
#   Zelda, The - The Minish Cap" and "The Legend of Zelda: The Minish Cap"
#   both match "Zelda". The first matching series wins, so specific series
#   come before general ones.
# - `reach` says how a site can be read: "fetch" (pages open), "search"
#   (behind a bot check: only through web search), "mediawiki" (its API is
#   at `api`), or "api" (a JSON API at `api`).
# - `domain` is what web search may use: a host, a host with a path, or a
#   wildcard such as "*.fandom.com". A site has one name everywhere in the
#   map, which is the text its citations carry.
# - `pictures` names the wiki a series' pictures in answers come from
#   (decision 0015), when it isn't the series' first "mediawiki" site on a
#   host of its own. It needs MediaWiki's PageImages, and `curl` must reach
#   it: Bulbapedia's bot check turns `curl` away.
# - `games` gives where a site's page for a game starts. A game's name must
#   begin with one of the `names` (the same words are ignored); the longest
#   match wins. Every Serebii path here answered 200 on 2026-11-04.
#
# Left out to keep the domain list short: The Cutting Room Floor, TASVideos,
# Speedrun.com, HowLongToBeat and GameHacking.org (research §5.2).

# Fan games, and ROM hacks of the series in `hacks_of`. A fan game gets these
# first; an unlisted copy of a series in `hacks_of` gets them after its
# series' own.
[fan_games]
hacks_of = ["pokemon"]

[[fan_games.sources]]
name = "Fandom"
domain = "*.fandom.com"
reach = "mediawiki"
api = "/api.php"
good_for = "the game's own wiki, such as Infinite Fusion's or Reborn's"

[[fan_games.sources]]
name = "Miraheze"
domain = "*.miraheze.org"
reach = "mediawiki"
api = "/w/api.php"
good_for = "the game's own wiki when it left Fandom, such as Unbound's or Infinity's"

[[fan_games.sources]]
name = "Eevee Expo"
domain = "eeveeexpo.com"
reach = "fetch"
good_for = "Pokémon Essentials games' pages and their makers' threads"

[[fan_games.sources]]
name = "Relic Castle"
domain = "reliccastle.com"
reach = "fetch"
good_for = "older Essentials games' pages"

[[fan_games.sources]]
name = "PokéCommunity"
domain = "pokecommunity.com"
reach = "search"
good_for = "ROM hack and fan game threads: makers' docs, FAQs, changelogs"

[[fan_games.sources]]
name = "romhack.ing"
domain = "romhack.ing"
reach = "fetch"
good_for = "hack pages and readmes"

# Every game, after its series.
[fallback]

[[fallback.sources]]
name = "StrategyWiki"
domain = "strategywiki.org"
reach = "mediawiki"
api = "/w/api.php"
good_for = "walkthroughs for most games"

[[fallback.sources]]
name = "GameFAQs"
domain = "gamefaqs.gamespot.com"
reach = "search"
good_for = "text guides and FAQs for nearly every game"

[[fallback.sources]]
name = "IGN"
domain = "ign.com/wikis"
reach = "fetch"
good_for = "guides for popular games"

[[fallback.sources]]
name = "Fandom"
domain = "*.fandom.com"
reach = "mediawiki"
api = "/api.php"
good_for = "the game's own wiki when it has no independent one"

