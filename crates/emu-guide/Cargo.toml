[package]
name = "emu-guide"
description = "Guide, the chat about the game being played: OpenRouter sign-in, its key, and its API, through curl."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The versions emu-app already uses.
base64 = "0.22"
# Parses answers' Markdown; pure Rust, no default features (no binary).
pulldown-cmark = { version = "0.12", default-features = false }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
# The source map, sources.toml.
toml.workspace = true

[dev-dependencies]
# The app's folders, for the example's key.
emu-os.workspace = true

[lints]
workspace = true
