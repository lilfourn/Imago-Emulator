[package]
name = "emu-app"
description = "Desktop frontend built on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ds-emulator"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel = "2"
base64 = "0.22"
chrono.workspace = true
cpal.workspace = true
crc32fast.workspace = true
emu-3ds.workspace = true
emu-cheats.workspace = true
emu-core.workspace = true
emu-cores.workspace = true
emu-guide.workspace = true
emu-os.workspace = true
emu-patch.workspace = true
emu-script.workspace = true
emu-state.workspace = true
gilrs.workspace = true
gpui.workspace = true
# Reads store screenshots (PNG, JPEG, GIF, BMP or WebP, as GPUI already
# decodes them) and writes covers as PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Pure Rust; Photo-JPEG frames for recordings. Based in part on the work of
# the Independent JPEG Group.
jpeg-encoder = "0.7"
lz4_flex.workspace = true
# Lines rewind states up with the next ones; already used through GPUI.
memchr = "2"
png.workspace = true
rtrb.workspace = true
serde.workspace = true
# The store's catalogs are JSON; already used through emu-mkxp.
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
toml.workspace = true
# Unpacks downloaded games; reading only needs inflate, not the zopfli
# compressor the plain `deflate` feature adds.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# AppKit, for what GPUI leaves out: hiding the window's close, minimise and
# zoom buttons, the standard About panel, the Dock icon and the display's
# refresh rate. The versions GPUI already uses.
[target.'cfg(target_os = "macos")'.dependencies]
# The emulation thread's quality of service (qos.rs); already used through
# GPUI and emu-3ds.
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSImageView",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
] }
# Metal and MetalFX for the upscaler (gpu_upscale.rs, decision 0013);
# objc2-metal is the version already in GPUI's tree.
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-metal-fx = { version = "0.3", default-features = false, features = [
    "std",
    "MTLFXSpatialScaler",
] }
raw-window-handle = "0.6"

# The Windows exe's icon and version information (build.rs); the version
# GPUI already uses for its manifest. A build dependency's platform is the
# machine building, which for this must be Windows, where the resource
# compiler is.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
