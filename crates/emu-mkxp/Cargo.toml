[package]
name = "emu-mkxp"
description = "Plays RPG Maker games that mkxp-z runs, hidden, in a process of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crc32fast.workspace = true
emu-core.workspace = true
# The app's data folder, where the players are kept, and the download and
# install of the hosted mkxp-z.
emu-os.workspace = true
# The TCP link's token and the private X display's cookie.
getrandom = "0.3"
# O_NONBLOCK, to open the sound pipe without waiting for its other end.
libc = "0.2"
# The game's mkxp.json, read and written again for the hidden player.
serde_json = "1"
thiserror.workspace = true
# Unpacks the hosted mkxp-z, upstream's zipped CI artifact; as emu-app
# reads zips.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The named pipe the player's sound comes through on Windows, and the
# power throttling its process is kept from.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The digests of the stand-ins the install tests download; emu-os checks
# the real one.
sha2 = "0.10"

[lints]
workspace = true
