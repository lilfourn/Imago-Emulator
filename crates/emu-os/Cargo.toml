[package]
name = "emu-os"
description = "The folders the app keeps its data, settings and caches in, on each system, and how it runs other programs, downloads and installs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
# Checks downloads against the digests pinned in the crates that install
# them; the version those crates already use.
sha2 = "0.10"

# Reads and sets threads' quality of service.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints]
workspace = true
